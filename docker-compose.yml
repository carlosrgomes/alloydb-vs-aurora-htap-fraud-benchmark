services:
  alloydb-omni:
    image: google/alloydbomni:16
    container_name: sprint-alloydb-omni
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    shm_size: "4gb"
    cpus: "${CONTAINER_CPUS:-4.0}"
    mem_limit: "${CONTAINER_MEM_LIMIT:-16g}"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "google_columnar_engine.enabled=on"
      - "-c"
      - "google_columnar_engine.memory_size_in_mb=4096"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-baseline:
    image: pgvector/pgvector:pg16
    container_name: sprint-postgres-baseline
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    shm_size: "4gb"
    cpus: "${CONTAINER_CPUS:-4.0}"
    mem_limit: "${CONTAINER_MEM_LIMIT:-16g}"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "random_page_cost=1.1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
