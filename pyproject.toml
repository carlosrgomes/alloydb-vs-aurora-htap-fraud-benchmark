[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alloydb-htap-aurora-benchmark"
version = "1.0.0"
description = "Beyond Aurora for Real-Time AI Agents: Sub-20ms HTAP Payment Fraud & Anomaly Benchmark with AlloyDB Columnar Engine, SCaNN, and Autonomous Gemini 4 Hydrogen Triage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Carlos Barbero", email = "carlosrgomes@gmail.com" }
]
dependencies = [
    "psycopg[binary,pool]>=3.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "google-genai>=1.0.0",
    "rich>=13.9.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that require a live PostgreSQL / AlloyDB Omni container",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
